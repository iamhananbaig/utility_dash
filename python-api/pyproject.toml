[project]
name = "bill-api"
version = "0.1.0"
description = "Bill extractor API for Pakistani utility providers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncer>=0.0.18",
    "beautifulsoup4>=4.15.0",
    "chardet>=5.0.0",
    "fastapi[standard]>=0.139.2",
    "httpx[socks]>=0.28.1",
    "lxml>=5.0.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "phonenumbers>=8.13.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.51.0",
]

[tool.fastapi]
entrypoint = "main:app"

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["FAST"]
